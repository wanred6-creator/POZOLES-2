<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pozoles Las Tías - Menú Digital</title>
    <!-- Tailwind CSS para un diseño limpio y moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 pb-28">

    <!-- Encabezado -->
    <header class="bg-red-700 text-white p-4 shadow-md sticky top-0 z-30 text-center">
        <h1 class="text-xl font-bold tracking-wide">POZOLES LAS TÍAS</h1>
        <p id="table-indicator" class="text-xs text-red-100 mt-1 font-medium">Estás ordenando desde: Mesa 1</p>
    </header>

    <!-- Contenedor Principal del Menú -->
    <main class="max-w-md mx-auto p-4 space-y-4">
        <div id="menu-container" class="space-y-4">
            <!-- Los platillos se cargan dinámicamente aquí -->
        </div>
    </main>

    <!-- Barra Inferior de Mesas y Carrito -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-3 shadow-lg z-30 max-w-md mx-auto flex justify-around items-center">
        <button onclick="cambiarMesa('M1')" class="table-btn px-2.5 py-1.5 rounded text-xs font-bold transition-all bg-red-700 text-white shadow" data-table="M1">M1 (0)</button>
        <button onclick="cambiarMesa('M2')" class="table-btn px-2.5 py-1.5 rounded text-xs font-bold transition-all bg-gray-200 text-gray-700" data-table="M2">M2 (0)</button>
        <button onclick="cambiarMesa('M3')" class="table-btn px-2.5 py-1.5 rounded text-xs font-bold transition-all bg-gray-200 text-gray-700" data-table="M3">M3 (0)</button>
        <button onclick="cambiarMesa('M4')" class="table-btn px-2.5 py-1.5 rounded text-xs font-bold transition-all bg-gray-200 text-gray-700" data-table="M4">M4 (0)</button>
        <button onclick="cambiarMesa('Llevar')" class="table-btn px-2.5 py-1.5 rounded text-xs font-bold transition-all bg-gray-800 text-white" data-table="Llevar">Llevar (0)</button>
    </nav>

    <!-- Modal de Personalización / Resumen -->
    <div id="modal" class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl space-y-4 animate-in fade-in zoom-in duration-200">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 id="modal-title" class="text-lg font-bold text-gray-800">Detalle del platillo</h3>
                <button onclick="cerrarModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
            </div>
            
            <div id="modal-body" class="space-y-3">
                <!-- Opciones dinámicas -->
            </div>

            <div class="flex gap-3 pt-2">
                <button onclick="cerrarModal()" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2.5 rounded-xl transition">Cancelar</button>
                <button id="modal-btn-confirmar" onclick="agregarAlCarritoConfirmar()" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-semibold py-2.5 rounded-xl shadow-md transition">Agregar</button>
            </div>
        </div>
    </div>

    <!-- Modal del Carrito / Enviar Pedido -->
    <div id="cart-modal" class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl space-y-4">
            <h3 id="cart-modal-title" class="text-lg font-bold text-gray-800 border-b pb-2">Tu Pedido</h3>
            <div id="cart-items-list" class="space-y-3 max-h-60 overflow-y-auto pr-1">
                <!-- Items del carrito -->
            </div>
            <div class="border-t pt-3 flex justify-between items-center font-bold text-lg">
                <span>Total:</span>
                <span id="cart-modal-total" class="text-red-600">$0.00</span>
            </div>
            <div class="space-y-2 pt-2">
                <button onclick="enviarWhatsApp()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl shadow-md transition flex items-center justify-center gap-2">
                    Enviar por WhatsApp 📱
                </button>
                <button onclick="limpiarMesaActual()" class="w-full bg-red-100 hover:bg-red-200 text-red-700 font-semibold py-2 rounded-xl text-sm transition">
                    🗑️ Limpiar este pedido
                </button>
                <button onclick="cerrarCartModal()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-600 font-medium py-2 rounded-xl text-sm transition">
                    Seguir comprando
                </button>
            </div>
        </div>
    </div>

    <!-- Script de Lógica del Menú -->
    <script>
        // Datos del menú
        const menuItems = [
            { id: 'pozole', name: 'Pozole', price: 80, desc: 'Desde $80', img: 'pozole.jpg', hasOptions: true },
            { id: 'pancita', name: 'Pancita', price: 80, desc: 'Desde $80', img: 'pancita.jpg', hasOptions: true },
            { id: 'flautas', name: 'Flautas', price: 75, desc: '$75.00', img: 'flautas.jpg', hasOptions: false },
            { id: 'pambazo', name: 'Pambazo', price: 35, desc: '$35.00', img: 'pambazo.jpg', hasOptions: true },
            { id: 'tostada', name: 'Tostada', price: 30, desc: '$30.00', img: 'tostada.jpg', hasOptions: false }
        ];

        let mesaActual = 'M1';
        // Estructura de pedidos por mesa
        let pedidos = { 'M1': [], 'M2': [], 'M3': [], 'M4': [], 'Llevar': [] };
        let itemSeleccionado = null;

        // Inicializar la vista
        function renderMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';

            menuItems.forEach(item => {
                container.innerHTML += `
                    <div class="bg-white rounded-2xl p-3 shadow-sm border border-gray-100 flex items-center justify-between gap-3">
                        <img src="${item.img}" alt="${item.name}" class="w-20 h-20 object-cover rounded-xl shadow-inner" onerror="this.src='https://via.placeholder.com/80'">
                        <div class="flex-1">
                            <h2 class="font-bold text-gray-800 text-base">${item.name}</h2>
                            <p class="text-sm text-gray-500 font-medium">${item.desc}</p>
                        </div>
                        <button onclick="abrirOpciones('${item.id}')" class="bg-red-600 hover:bg-red-700 text-white font-semibold px-4 py-2 rounded-xl shadow transition text-sm">
                            Agregar
                        </button>
                    </div>
                `;
            });
            actualizarBotonesMesas();
        }

        function cambiarMesa(mesa) {
            mesaActual = mesa;
            document.getElementById('table-indicator').innerText = `Estás ordenando desde: ${mesa === 'Llevar' ? 'Para Llevar' : 'Mesa ' + mesa.replace('M','')}`;
            
            // Actualizar diseño de botones inferiores
            document.querySelectorAll('.table-btn').forEach(btn => {
                if(btn.dataset.table === mesa) {
                    btn.className = "table-btn px-2.5 py-1.5 rounded text-xs font-bold transition-all bg-red-700 text-white shadow";
                } else {
                    btn.className = "table-btn px-2.5 py-1.5 rounded text-xs font-bold transition-all bg-gray-200 text-gray-700";
                }
            });

            // Si ya hay elementos en esta mesa, abrir el resumen del carrito de inmediato al tocar la barra
            if(pedidos[mesaActual].length > 0) {
                abrirCartModal();
            }
        }

        function abrirOpciones(id) {
            itemSeleccionado = menuItems.find(i => i.id === id);
            const modalBody = document.getElementById('modal-body');
            const modalTitle = document.getElementById('modal-title');
            
            modalTitle.innerText = `${itemSeleccionado.name} (${mesaActual === 'Llevar' ? 'Para Llevar' : 'Mesa ' + mesaActual.replace('M','')})`;
            modalBody.innerHTML = '';

            if (id === 'pambazo') {
                modalBody.innerHTML = `
                    <p class="text-xs text-gray-500">Selecciona hasta 2 opciones (cada ingrediente extra cuesta $5)</p>
                    <div class="space-y-2 max-h-48 overflow-y-auto">
                        <label class="flex items-center gap-2 p-2 rounded-lg hover:bg-gray-50 cursor-pointer border"><input type="checkbox" name="pambazo-op" value="Sin papa" class="pambazo-option w-4 h-4 text-red-600"> Sin papa</label>
                        <label class="flex items-center gap-2 p-2 rounded-lg hover:bg-gray-50 cursor-pointer border"><input type="checkbox" name="pambazo-op" value="Papa con chorizo" checked class="pambazo-option w-4 h-4 text-red-600"> Papa con chorizo</label>
                        <label class="flex items-center gap-2 p-2 rounded-lg hover:bg-gray-50 cursor-pointer border"><input type="checkbox" name="pambazo-op" value="Pollo" class="pambazo-option w-4 h-4 text-red-600"> Pollo</label>
                        <label class="flex items-center gap-2 p-2 rounded-lg hover:bg-gray-50 cursor-pointer border"><input type="checkbox" name="pambazo-op" value="Carne" class="pambazo-option w-4 h-4 text-red-600"> Carne</label>
                        <label class="flex items-center gap-2 p-2 rounded-lg hover:bg-gray-50 cursor-pointer border"><input type="checkbox" name="pambazo-op" value="Quesillo" class="pambazo-option w-4 h-4 text-red-600"> Quesillo</label>
                    </div>
                    <div class="mt-3">
                        <label class="text-xs font-semibold text-gray-600">Observaciones:</label>
                        <input type="text" id="obs-input" placeholder="Ej. Sin lechuga" class="w-full mt-1 border rounded-xl p-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
                    </div>
                `;
            } else if (id === 'pozole' || id === 'pancita') {
                modalBody.innerHTML = `
                    <div class="space-y-2">
                        <label class="text-xs font-semibold text-gray-600">Tipo de carne / porción:</label>
                        <select id="select-extra" class="w-full border rounded-xl p-2.5 text-sm bg-white focus:ring-2 focus:ring-red-500">
                            <option value="Surtida">Surtida ($80)</option>
                            <option value="Cabeza">Cabeza ($80)</option>
                            <option value="Maciza">Maciza ($80)</option>
                        </select>
                    </div>
                    <div class="mt-3">
                        <label class="text-xs font-semibold text-gray-600">Observaciones:</label>
                        <input type="text" id="obs-input" placeholder="Ej. Bien caliente, sin cebolla" class="w-full mt-1 border rounded-xl p-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
                    </div>
                `;
            } else {
                modalBody.innerHTML = `
                    <div>
                        <label class="text-xs font-semibold text-gray-600">Observaciones:</label>
                        <input type="text" id="obs-input" placeholder="Ej. Con crema extra" class="w-full mt-1 border rounded-xl p-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
                    </div>
                `;
            }

            document.getElementById('modal').classList.remove('hidden');
        }

        function cerrarModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function agregarAlCarritoConfirmar() {
            let precioFinal = itemSeleccionado.price;
            let detalles = '';
            let obs = document.getElementById('obs-input') ? document.getElementById('obs-input').value : '';

            if (itemSeleccionado.id === 'pambazo') {
                let checkboxes = document.querySelectorAll('.pambazo-option:checked');
                let seleccionados = Array.from(checkboxes).map(cb => cb.value);
                
                if (seleccionados.length === 0) {
                    alert('Por favor selecciona al menos una opción para el pambazo.');
                    return;
                }
                
                detalles = seleccionados.join(' + ');
                
                // CORRECCIÓN CLAVE DE PRECIO:
                // El precio base ($35) incluye la 1ra opción. Cada opción extra suma $5.
                let extrasCount = Math.max(0, seleccionados.length - 1);
                precioFinal = 35 + (extrasCount * 5);

            } else if (itemSeleccionado.id === 'pozole' || itemSeleccionado.id === 'pancita') {
                let select = document.getElementById('select-extra');
                detalles = select ? select.value : '';
            }

            if (obs.trim() !== '') {
                detalles += (detalles ? ' | ' : '') + `Nota: ${obs}`;
            }

            // Buscar si ya existe un ítem idéntico en el carrito de esta mesa
            let existente = pedidos[mesaActual].find(p => p.id === itemSeleccionado.id && p.detalles === detalles);
            if (existente) {
                existente.cantidad += 1;
            } else {
                pedidos[mesaActual].push({
                    id: itemSeleccionado.id,
                    name: itemSeleccionado.name,
                    precioUnitario: precioFinal,
                    detalles: detalles,
                    cantidad: 1
                });
            }

            cerrarModal();
            actualizarBotonesMesas();
            abrirCartModal();
        }

        function actualizarBotonesMesas() {
            for (let m in pedidos) {
                let totalItems = pedidos[m].reduce((sum, item) => sum + item.cantidad, 0);
                let btn = document.querySelector(`.table-btn[data-table="${m}"]`);
                if(btn) {
                    let nombreMesa = m === 'Llevar' ? 'Llevar' : m;
                    btn.innerText = `${nombreMesa} (${totalItems})`;
                }
            }
        }

        function abrirCartModal() {
            const listContainer = document.getElementById('cart-items-list');
            const cartTotalElem = document.getElementById('cart-modal-total');
            const cartTitle = document.getElementById('cart-modal-title');
            
            cartTitle.innerText = `Pedido de ${mesaActual === 'Llevar' ? 'Para Llevar' : 'Mesa ' + mesaActual.replace('M','')}`;
            listContainer.innerHTML = '';

            let currentCart = pedidos[mesaActual];
            if (currentCart.length === 0) {
                listContainer.innerHTML = `<p class="text-center text-gray-400 py-4 text-sm">No hay platillos en este pedido.</p>`;
                cartTotalElem.innerText = '$0.00';
                document.getElementById('cart-modal').classList.remove('hidden');
                return;
            }

            let totalGeneral = 0;
            currentCart.forEach((item, index) => {
                let subtotal = item.precioUnitario * item.cantidad;
                totalGeneral += subtotal;
                listContainer.innerHTML += `
                    <div class="flex justify-between items-center border-b pb-2 text-sm">
                        <div>
                            <p class="font-bold text-gray-800">${item.name} <span class="text-xs text-gray-500 font-normal">($${item.precioUnitario})</span></p>
                            <p class="text-xs text-gray-500">${item.detalles}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="cambiarCantidad(${index}, -1)" class="bg-gray-200 px-2 py-0.5 rounded font-bold text-xs">-</button>
                            <span class="font-bold text-sm">${item.cantidad}</span>
                            <button onclick="cambiarCantidad(${index}, 1)" class="bg-gray-200 px-2 py-0.5 rounded font-bold text-xs">+</button>
                        </div>
                    </div>
                `;
            });

            cartTotalElem.innerText = `$${totalGeneral.toFixed(2)}`;
            document.getElementById('cart-modal').classList.remove('hidden');
        }

        function cambiarCantidad(index, delta) {
            let currentCart = pedidos[mesaActual];
            currentCart[index].cantidad += delta;
            if (currentCart[index].cantidad <= 0) {
                currentCart.splice(index, 1);
            }
            actualizarBotonesMesas();
            abrirCartModal();
        }

        function cerrarCartModal() {
            document.getElementById('cart-modal').classList.add('hidden');
        }

        function limpiarMesaActual() {
            if (confirm('¿Deseas limpiar todos los platillos de esta mesa?')) {
                pedidos[mesaActual] = [];
                actualizarBotonesMesas();
                cerrarCartModal();
            }
        }

        function enviarWhatsApp() {
            let currentCart = pedidos[mesaActual];
            if (currentCart.length === 0) {
                alert('No hay productos en el pedido.');
                return;
            }

            let texto = `*NUEVO PEDIDO - POZOLES LAS TÍAS*\n`;
            texto += `📍 *Ubicación:* ${mesaActual === 'Llevar' ? 'Para Llevar' : 'Mesa ' + mesaActual.replace('M','')}\n\n`;
            
            let total = 0;
            currentCart.forEach(item => {
                let sub = item.precioUnitario * item.cantidad;
                total += sub;
                texto += `▪️ ${item.cantidad}x ${item.name}`;
                if(item.detalles) texto += ` (${item.detalles})`;
                texto += ` - $${sub}\n`;
            });

            texto += `\n💰 *TOTAL A PAGAR: $${total.toFixed(2)}*`;

            // Número de WhatsApp del negocio (reemplaza con tu número a 10 dígitos con código de país 52)
            let numeroNegocio = "525500000000"; 
            let url = `https://wa.me/${numeroNegocio}?text=${encodeURIComponent(texto)}`;
            
            window.open(url, '_blank');
        }

        // Cargar menú al iniciar
        window.onload = renderMenu;
    </script>
</body>
</html>
